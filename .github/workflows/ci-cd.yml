name: CI — Website (Cloudflare Workers)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "24"

jobs:
  validate:
    name: Type Check, Lint & Workers Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set preview environment
        if: github.event_name == 'pull_request'
        run: echo "NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}" >> $GITHUB_ENV

      - name: Set staging environment
        if: github.ref == 'refs/heads/develop'
        run: echo "NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}" >> $GITHUB_ENV

      - name: Set production environment
        if: github.ref == 'refs/heads/main'
        run: echo "NEXT_PUBLIC_API_URL=${{ vars.PROD_API_URL }}" >> $GITHUB_ENV

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build Cloudflare Worker
        run: npm run build

      - name: Verify Worker artifact
        run: test -f .open-next/worker.js

# Cloudflare Workers Builds is connected directly to this repository and owns
# preview/production uploads. Keeping deployment out of GitHub Actions avoids
# duplicate uploads and Pages-vs-Workers configuration drift.
