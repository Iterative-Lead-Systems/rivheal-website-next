name: CI — Website (Cloudflare Workers)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "24"

jobs:
  validate:
    name: Type Check, Lint & Workers Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set preview environment
        if: github.event_name == 'pull_request'
        run: echo "NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}" >> $GITHUB_ENV

      - name: Set staging environment
        if: github.ref == 'refs/heads/develop'
        run: echo "NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}" >> $GITHUB_ENV

      - name: Set production environment
        if: github.ref == 'refs/heads/main'
        run: echo "NEXT_PUBLIC_API_URL=${{ vars.PROD_API_URL }}" >> $GITHUB_ENV

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build Cloudflare Worker
        run: npm run build

      - name: Verify Worker artifact
        run: test -f .open-next/worker.js

      - name: Install dependencies
        run: npm ci

      - name: Set env — develop (staging)
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}"            >> $GITHUB_ENV
          echo "NEXT_PUBLIC_APP_VERSION=sha-$(git rev-parse --short HEAD)"  >> $GITHUB_ENV
          echo "NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID}}"        >> $GITHUB_ENV

      - name: Set env — main (production)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ vars.PROD_API_URL }}"               >> $GITHUB_ENV
          echo "NEXT_PUBLIC_APP_VERSION=sha-$(git rev-parse --short HEAD)"  >> $GITHUB_ENV
          echo "NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID}}"        >> $GITHUB_ENV

      - name: Set env — PR (preview)
        if: github.event_name == 'pull_request'
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}"            >> $GITHUB_ENV
          echo "NEXT_PUBLIC_APP_VERSION=pr-${{ github.event.number }}"      >> $GITHUB_ENV
          echo "NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID}}"        >> $GITHUB_ENV

      - name: Build for Cloudflare Pages
        run: npm run pages:build

      # Always upload — preview, staging, and prod jobs all download this
      - name: Upload CF Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-pages-${{ github.sha }}
          path: .vercel/output/static/
          retention-days: 3

  # ── 3. Preview deployment (PRs only) ───────────────────────
  preview:
    name: Deploy Preview (PR)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download CF Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: cf-pages-${{ github.sha }}
          path: .vercel/output/static/

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=${{ vars.CF_PAGES_PROJECT_NAME }} --branch=pr-${{ github.event.number }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed**: ${process.env.DEPLOYMENT_URL}`
            })

  # ── 4. Deploy → Staging (develop branch) ───────────────────
  deploy-staging:
    name: Deploy → Staging (CF Pages)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.rivheal.com
    steps:
      - name: Download CF Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: cf-pages-${{ github.sha }}
          path: .vercel/output/static/

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=${{ vars.CF_PAGES_PROJECT_NAME }} --branch=develop

  # ── 5. Deploy → Production (main branch, manual approval) ──
  deploy-prod:
    name: Deploy → Production (CF Pages)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://rivheal.com
    steps:
      - name: Download CF Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: cf-pages-${{ github.sha }}
          path: .vercel/output/static/

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=${{ vars.CF_PAGES_PROJECT_NAME }} --branch=main
# Cloudflare Workers Builds is connected directly to this repository and owns
# preview/production uploads. Keeping deployment out of GitHub Actions avoids
# duplicate uploads and Pages-vs-Workers configuration drift.
